<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transferencia exitosa - Banca 360</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body-historial">
    <div class="historial-wrapper">
        <header class="header-banco">
            <div class="header-left">
                <a href="principal.html" class="nav-link-home">
                    <img class="iconoinvertido" src="assets/house-svgrepo-com.svg">
                </a>
                <h1 class="logo">Banca 36🌎</h1>
            </div>
            <div class="header-right">
                <div class="perfil-interactuable">
                    <button class="perfil-btn" id="btnPerfil">
                        <div class="usuario-iniciales">AP</div>
                    </button>
                    <div class="perfil-interactuable-menu" id="menuPerfil">
                        <a href="consultar_perfil.html" class="menu-option">Consultar perfil</a>
                        <a href="iniciar_sesion.html" class="menu-option">Cerrar sesión</a>
                        <div class="theme-switch-wrapper">
                            <button id="theme-toggle" class="boton-tema">
                                <span id="theme-icon">🌙</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="exito-wrapper">
            <div class="exito-card">
                <div class="exito-icono">✓</div>
                <h1 class="exito-titulo">¡Transferencia exitosa!</h1>
                <div class="exito-monto">Bs. 4.000</div>

                <div class="exito-detalles">
                    <div class="exito-fila"><span class="label">Nro de referencia</span><span class="valor">708023438973</span></div>
                    <div class="exito-fila"><span class="label">Fecha y hora</span><span class="valor">01/04/2026 - 10:23 pm</span></div>
                    <div class="exito-fila"><span class="label">Cta origen</span><span class="valor">Cta ahorro *935</span></div>
                    <div class="exito-fila"><span class="label">Cta destino</span><span class="valor">María López - Cta ahorro *766</span></div>
                    <div class="exito-fila"><span class="label">Asunto</span><span class="valor">Pago corte de pelo del perro</span></div>
                </div>

                <div class="exito-acciones">
                    <a href="principal.html" class="btn-secundario">Ir al inicio</a>
                    <a href="transferir_otras_form.html" class="btn-transferir" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">Nueva transferencia</a>
                </div>
            </div>
        </main>
    </div>
    <script src="login.js"></script>
</body>
</html>
