<!DOCTYPE html>
<html>

<head>
    <title>Prueba</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="super_main_container_kaiokenx10">

        <header class="genkidama">
            <div class="logo">Banca 360🌎</div>
            <nav class="nav-links">
                <a href="#">Ayuda</a>
                <a href="#">Contacto</a>
            </nav>
            <div class="theme-switch-wrapper" style="opacity: 0; pointer-events: none; position: absolute;">
                <button id="theme-toggle" class="boton-tema">
                    <span id="theme-icon">🌙</span>
                </button>
        </header>

        <div class="main-container">
            <div class="imagen-decorativa">
                <video autoplay muted loop playsinline class="video-fondo">
                    <source src="assets/video_tierra.mp4" type="video/mp4">
                    Tu navegador no soporta videos.
                </video>
            </div>

            <div class="Tarjeta">
                <h1>Crea tu perfil</h1>

                <form id="miFormulario" action="preguntas_seguridad.html" method="get">
                    <label for="email" class="etiqueta-formulario">Tu Email</label>
                    <input type="email" id="email" placeholder="EJ: tuemail@dominio.com" required>
                    <br>

                    <label for="password" class="etiqueta-formulario">Tu Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    <br>

                    <label for="confirmPassword" class="etiqueta-formulario">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Mínimo 6 caracteres" minlength="6"
                        required>
                    <br>
                    
                    <button type="submit" class="boton" id="btn-seguir">Seguir</button>
                </form>

                <div class="divisor">
                    <span>o continúa con</span>
                </div>

                <div class="social-buttons">
                    <button class="boton2">Google</button>
                    <button class="boton2">Facebook</button>
                </div>

                <h4>¿Ya tienes una cuenta?
                    <a href="iniciar_sesion.html" class="button">Iniciar Sesión</a>
                </h4>
            </div>
        </div>

        <footer class="puno-dragon">
            <p>&copy; 2026 Banca 360. Todos los derechos reservados. Prototipo Estético Avanzado.</p>
        </footer>

    </div>
    <div class="theme-switch-wrapper">
        <button id="theme-toggle" class="boton-tema">
            <span id="theme-icon">🌙</span>
        </button>
    </div>

    <div id="loader-container" class="loader-overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Cargando tu experiencia...</p>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
