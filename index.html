<!DOCTYPE html>
<html>  
    <head>
        <title>Prueba</title>
        <link rel="stylesheet" href="styles.css">
        
    </head>
    <body>
    <div class="main-container">
    <div class="imagen-decorativa">
        <video autoplay muted loop playsinline class="video-fondo">
            <source src="video_tierra.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>
    </div>

    

    <div class="Tarjeta">


        <h1>Crea tu perfil</h1>
    

        <form>
            <label for="email" class="etiqueta-formulario">Tu Email</label>
  
            <input type="email" id="email" placeholder="EJ: tuemail@dominio.com" required>
            <br>

            <label for="password" class="etiqueta-formulario">Tu Contraseña</label>

            <input type="password" id="password" placeholder="Mínimo 5 caracteres" required>
            <br>
            <br>
            <button type="submit" class="boton">Seguir</button>
        </form>

        <div class="divisor">
            <span>o continúa con</span>
        </div>

        <div class="social-buttons">
            <button class="boton2">Google</button>
            <button class="boton2">Facebook</button>
        </div>

        <h4>¿Ya tienes una cuenta? <a href="#">Inicia Sesión</a></h4>
    
    </div>  
    </div>

            <div class="theme-switch-wrapper">
        <button id="theme-toggle" class="boton-tema">
            <span id="theme-icon">🌙</span>
        </button>
    </div>

    <script>
        const btn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');
        const currentTheme = localStorage.getItem('theme');

        // Si ya tenía preferencia guardada, se aplica
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            icon.textContent = '☀️';
        }

        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            let theme = 'light';
            if (document.body.classList.contains('dark-mode')) {
                theme = 'dark';
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
            // Guardamos la elección
            localStorage.setItem('theme', theme);
        });
    </script>
        
    </body>




</html>
