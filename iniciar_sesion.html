<!DOCTYPE html>
<html>

<head>
    <title>Inicio de Sesión-Banca360</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="super_main_container_kaiokenx10">

        <header class="genkidama">
            <div class="logo">Banca 360🌎</div>
            <nav class="nav-links">
                <a href="#">Ayuda</a>
                <a href="#">Contacto</a>
            </nav>
            <div class="theme-switch-wrapper" style="opacity: 0; pointer-events: none; position: absolute;">
                <button id="theme-toggle" class="boton-tema">
                    <span id="theme-icon">🌙</span>
                </button>
        </header>

        <div class="main-container">
            <div class="imagen-decorativa">
                <video autoplay muted loop playsinline class="video-fondo">
                    <source src="assets/video_tierra.mp4" type="video/mp4">
                    Tu navegador no soporta videos.
                </video>
            </div>

            <div class="Tarjeta">
                <h1>Iniciar Sesión</h1>
                <form id="miFormulario">
                    <label for="email" class="etiqueta-formulario">Tu Email</label>
                    <input type="email" id="email" placeholder="EJ: tuemail@dominio.com" required>
                    <br>
                    <label for="password" class="etiqueta-formulario">Tu Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 5 caracteres" required>
                    <br>
                    <br>
                    <button type="submit" class="boton">Seguir</button>
                </form>

                <div class="divisor">
                    <span>o continúa con</span>
                </div>

                <div class="social-buttons">
                    <button class="boton2">Google</button>
                    <button class="boton2">Facebook</button>
                </div>
            </div>
        </div>

        <footer class="puno-dragon">
            <p>&copy; 2026 Banca 360. Todos los derechos reservados. Prototipo Estético Avanzado.</p>
        </footer>

    </div>



    <div id="loader-container" class="loader-overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Cargando tu experiencia...</p>
        </div>
    </div>
    <script src="login.js"></script>

</body>

</html>
