<!DOCTYPE html>
<html>

<head>
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="main-container">
        <div class="imagen-decorativa">
            <video autoplay muted loop playsinline class="video-fondo">
                <source src="video_tierra.mp4" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </div>



        <div class="Tarjeta">


            <h1>Iniciar Sesión</h1>


            <form id="miFormulario"> <label for="email" class="etiqueta-formulario">Tu Email</label>
                <input type="email" id="email" placeholder="EJ: tuemail@dominio.com" required>
                <br>
                <label for="password" class="etiqueta-formulario">Tu Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 5 caracteres" required>
                <br>
                <br>
                <button type="submit" class="boton">Seguir</button>
            </form>

            <div class="divisor">
                <span>o continúa con</span>
            </div>

            <div class="social-buttons">
                <button class="boton2">Google</button>
                <button class="boton2">Facebook</button>
            </div>

           

        </div>
    </div>

    <div class="theme-switch-wrapper">
        <button id="theme-toggle" class="boton-tema">
            <span id="theme-icon">🌙</span>
        </button>
    </div>


    <div id="loader-container" class="loader-overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Cargando tu experiencia...</p>
        </div>
    </div>
    <script>
        const btn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');
        const currentTheme = localStorage.getItem('theme');

        // Si ya tenía preferencia guardada, se aplica
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            icon.textContent = '☀️';
        }

        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');

            let theme = 'light';
            if (document.body.classList.contains('dark-mode')) {
                theme = 'dark';
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
            // Guardamos la elección
            localStorage.setItem('theme', theme);
        });

        const formulario = document.getElementById('miFormulario');
        const loader = document.getElementById('loader-container');

        formulario.addEventListener('submit', (event) => {
            event.preventDefault(); // Detiene el envío real para mostrar la animación 

            loader.classList.add('active'); // Muestra el cargador 

            setTimeout(() => {
                window.location.href = "bienvenida.html"; // Redirige tras 2 segundos [cite: 12]
            }, 2000);
        });

        const linkIniciar = document.getElementById('link-iniciar-sesion');
        const loaderContainer = document.getElementById('loader-container'); // Asegúrate de que este ID coincida con tu div del spinner

    </script>

</body>




</html>
